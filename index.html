<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planner Juárez Pro - Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; background: #020617; touch-action: none; }
        canvas { display: block; }

        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom); }

        .ui-card {
            position: absolute; bottom: 20px; left: 10px; right: 10px;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            border-radius: 24px; padding: 20px; z-index: 50;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.4);
            max-height: 70vh; overflow-y: auto;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-collapsed { transform: translateY(calc(100% - 60px)); }

        .input-pill {
            background: #f1f5f9; border: 1px solid #e2e8f0;
            padding: 12px 16px; border-radius: 14px; width: 100%;
            font-size: 14px; font-weight: 600; color: #1e293b; outline: none;
            box-sizing: border-box;
        }

        .btn-action {
            background: #2563eb; color: white; font-weight: 800;
            padding: 16px; border-radius: 16px; width: 100%;
            text-transform: uppercase; letter-spacing: 1px; font-size: 12px;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
            cursor: pointer; border: none;
        }

        .stats-top {
            position: absolute; top: 15px; right: 15px;
            background: rgba(15, 23, 42, 0.8); color: white;
            padding: 10px 18px; border-radius: 16px; text-align: right;
            backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.1);
        }

        .alert-toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: #ef4444; color: white; padding: 12px 24px;
            border-radius: 14px; font-size: 13px; font-weight: 700;
            z-index: 999; opacity: 0; transition: opacity 0.3s;
            pointer-events: none;
        }
        .alert-toast.visible { opacity: 1; }

        #layout-mini {
            width: 100%; height: 40px; background: #e2e8f0; border-radius: 10px;
            margin: 10px 0; position: relative; overflow: hidden;
        }
        .zone-mini { height: 100%; position: absolute; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 900; color: white; }
    </style>
</head>
<body>

    <!-- Toast de alerta -->
    <div id="alert-toast" class="alert-toast"></div>

    <!-- Estadísticas -->
    <div class="stats-top">
        <div id="util-val" class="text-2xl font-black text-blue-400">0%</div>
        <div class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Ocupación</div>
    </div>

    <!-- Panel de Control Deslizable -->
    <div id="ui-panel" class="ui-card card-collapsed shadow-2xl">
        <!-- Manija para deslizar -->
        <div onclick="toggleUI()" class="w-16 h-1.5 bg-slate-300 rounded-full mx-auto mb-4 cursor-pointer"></div>

        <div class="flex justify-between items-center mb-6">
            <h1 class="text-lg font-black text-slate-800 uppercase tracking-tight">Cubicaje Juárez Pro</h1>
            <button onclick="resetAll()" class="text-[10px] font-bold text-red-500 uppercase bg-transparent border-none cursor-pointer">Reiniciar</button>
        </div>

        <div class="space-y-4">
            <div>
                <label class="text-[10px] font-black text-slate-500 uppercase mb-1 block">Proveedor</label>
                <input type="text" id="prov-name" class="input-pill" value="Schneider Electric">
            </div>

            <div class="grid grid-cols-3 gap-3">
                <div>
                    <label class="text-[10px] font-black text-slate-500 uppercase mb-1 block">Largo (m)</label>
                    <input type="number" id="l-val" class="input-pill" value="1.2" step="0.1" min="0.1" max="16">
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-500 uppercase mb-1 block">Ancho (m)</label>
                    <input type="number" id="w-val" class="input-pill" value="1.0" step="0.1" min="0.1" max="2.5">
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-500 uppercase mb-1 block">Alto (m)</label>
                    <input type="number" id="h-val" class="input-pill" value="1.2" step="0.1" min="0.1" max="2.7">
                </div>
            </div>

            <div>
                <label class="text-[10px] font-black text-slate-500 uppercase mb-1 block">Cantidad</label>
                <div class="flex gap-3">
                    <input type="number" id="qty-val" class="input-pill text-center text-lg text-blue-600" value="12" min="1" max="999">
                    <button onclick="addMaterial()" class="btn-action">Cargar</button>
                </div>
            </div>

            <div class="pt-4 border-t border-slate-100">
                <label class="text-[10px] font-black text-slate-500 uppercase mb-1 block">Zonificación</label>
                <div id="layout-mini"></div>
            </div>

            <button onclick="generatePDFs()" class="w-full bg-slate-900 text-white font-bold p-4 rounded-2xl flex items-center justify-center gap-2 uppercase text-xs border-none cursor-pointer">
                Descargar Certificados PDF
            </button>

            <div id="load-list" class="space-y-2 pb-10"></div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, controls, container;
        let cargo = [];
        let allCargo = [];
        let zones = [];
        let batchIdCounter = 0;
        let cSize = { l: 16.15, w: 2.5, h: 2.7 };
        let currentHue = 210;

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020617);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(22, 15, 22);

            renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const sun = new THREE.DirectionalLight(0xffffff, 0.5);
            sun.position.set(10, 20, 10);
            scene.add(sun);

            scene.add(new THREE.GridHelper(50, 50, 0x1e293b, 0x1e293b));

            const geo = new THREE.BoxGeometry(cSize.l, cSize.h, cSize.w);
            container = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0x334155, transparent: true, opacity: 0.1, side: THREE.BackSide }));
            container.position.set(cSize.l / 2, cSize.h / 2, cSize.w / 2);
            scene.add(container);

            const frame = new THREE.LineSegments(
                new THREE.EdgesGeometry(geo),
                new THREE.LineBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.2 })
            );
            frame.position.copy(container.position);
            scene.add(frame);

            animate();
        }

        function showToast(msg) {
            const t = document.getElementById('alert-toast');
            t.textContent = msg;
            t.classList.add('visible');
            setTimeout(() => t.classList.remove('visible'), 3000);
        }

        function toggleUI() {
            document.getElementById('ui-panel').classList.toggle('card-collapsed');
        }

        function addMaterial() {
            const l = parseFloat(document.getElementById('l-val').value);
            const w = parseFloat(document.getElementById('w-val').value);
            const h = parseFloat(document.getElementById('h-val').value);
            const qty = parseInt(document.getElementById('qty-val').value);
            const prov = document.getElementById('prov-name').value.trim();

            if (!prov) { showToast('Ingresa un nombre de proveedor'); return; }
            if (isNaN(l) || isNaN(w) || isNaN(h) || l <= 0 || w <= 0 || h <= 0) { showToast('Dimensiones deben ser mayores a 0'); return; }
            if (isNaN(qty) || qty < 1) { showToast('Cantidad debe ser al menos 1'); return; }
            if (l > cSize.l || w > cSize.w || h > cSize.h) { showToast('Las dimensiones exceden el contenedor'); return; }

            const color = `hsl(${currentHue}, 80%, 55%)`;
            const bid = batchIdCounter++;

            for (let i = 0; i < qty; i++) {
                allCargo.push({ l, w, h, prov, color, bid, mesh: null });
            }
            currentHue = (currentHue + 45) % 360;
            refreshLoad();

            document.getElementById('ui-panel').classList.remove('card-collapsed');
        }

        function disposeMesh(mesh) {
            if (!mesh) return;
            mesh.children.forEach(child => {
                if (child.geometry) child.geometry.dispose();
                if (child.material) child.material.dispose();
            });
            if (mesh.geometry) mesh.geometry.dispose();
            if (mesh.material) mesh.material.dispose();
            scene.remove(mesh);
        }

        function refreshLoad() {
            cargo.forEach(c => disposeMesh(c.mesh));

            const groups = allCargo.reduce((acc, c) => {
                if (!acc[c.prov]) acc[c.prov] = [];
                acc[c.prov].push({ ...c, mesh: null });
                return acc;
            }, {});

            let curX = 0.05, curZ = 0.05, maxL = 0;
            let success = [];
            let dropped = 0;
            zones = [];

            for (const p in groups) {
                const items = groups[p];
                const blockStart = curX;
                let i = 0;
                while (i < items.length) {
                    const item = items[i];
                    if (curZ + item.w > cSize.w) {
                        curZ = 0.05;
                        curX += maxL + 0.05;
                        maxL = 0;
                    }
                    if (curX + item.l > cSize.l) {
                        dropped += items.length - i;
                        break;
                    }

                    let canStack = (i + 1 < items.length) && (item.h + items[i + 1].h <= cSize.h - 0.1);
                    let stack = canStack ? 2 : 1;

                    let yOff = 0;
                    for (let s = 0; s < stack; s++) {
                        const it = items[i + s];
                        const geo = new THREE.BoxGeometry(it.l, it.h, it.w);
                        const mat = new THREE.MeshStandardMaterial({ color: it.color, roughness: 0.5 });
                        const m = new THREE.Mesh(geo, mat);
                        m.position.set(curX + it.l / 2, (it.h / 2) + yOff, curZ + it.w / 2);
                        const edgeGeo = new THREE.EdgesGeometry(geo);
                        const edgeMat = new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.1 });
                        m.add(new THREE.LineSegments(edgeGeo, edgeMat));
                        it.mesh = m;
                        scene.add(m);
                        success.push(it);
                        yOff += it.h;
                    }
                    maxL = Math.max(maxL, item.l);
                    curZ += item.w + 0.05;
                    i += stack;
                }
                zones.push({ name: p, start: blockStart, end: curX + maxL, color: items[0].color });
            }

            cargo = success;
            if (dropped > 0) {
                showToast(dropped + ' bulto(s) no cupieron en el contenedor');
            }
            updateUI();
        }

        function updateUI() {
            const list = document.getElementById('load-list');
            const layout = document.getElementById('layout-mini');
            list.innerHTML = '';
            layout.innerHTML = '';
            let vol = 0;
            const bGroups = {};

            cargo.forEach(c => {
                vol += (c.l * c.w * c.h);
                bGroups[c.bid] = bGroups[c.bid] || { ...c, q: 0 };
                bGroups[c.bid].q++;
            });

            Object.values(bGroups).reverse().forEach(g => {
                const row = document.createElement('div');
                row.className = 'p-4 bg-white rounded-2xl border border-slate-100 flex items-center gap-4 shadow-sm';

                const dot = document.createElement('div');
                dot.className = 'w-3 h-10 rounded-full';
                dot.style.background = g.color;

                const info = document.createElement('div');
                const provLabel = document.createElement('div');
                provLabel.className = 'text-[10px] font-black text-blue-600 uppercase';
                provLabel.textContent = g.prov;
                const detail = document.createElement('div');
                detail.className = 'text-xs font-bold text-slate-800';
                detail.textContent = g.q + ' bultos (' + g.l + 'x' + g.w + 'm)';

                info.appendChild(provLabel);
                info.appendChild(detail);
                row.appendChild(dot);
                row.appendChild(info);
                list.appendChild(row);
            });

            zones.forEach(z => {
                const w = ((z.end - z.start) / cSize.l) * 100;
                const l = (z.start / cSize.l) * 100;
                if (w > 0) {
                    const zoneEl = document.createElement('div');
                    zoneEl.className = 'zone-mini';
                    zoneEl.style.cssText = 'left:' + l + '%; width:' + w + '%; background:' + z.color;
                    zoneEl.textContent = z.name;
                    layout.appendChild(zoneEl);
                }
            });

            const utilPct = ((vol / (cSize.l * cSize.w * cSize.h)) * 100).toFixed(1);
            document.getElementById('util-val').textContent = utilPct + '%';
        }

        async function generatePDFs() {
            if (!cargo.length) { showToast('No hay carga para generar certificados'); return; }
            const { jsPDF } = window.jspdf;
            const provs = [...new Set(cargo.map(c => c.prov))];
            const oldTarget = controls.target.clone();
            const oldPos = camera.position.clone();

            for (const pName of provs) {
                const z = zones.find(zn => zn.name === pName);
                cargo.forEach(c => {
                    if (c.mesh) {
                        if (c.prov === pName) {
                            c.mesh.material.color.set(c.color);
                            c.mesh.material.opacity = 1;
                            c.mesh.material.transparent = false;
                        } else {
                            c.mesh.material.color.set(0xffffff);
                            c.mesh.material.opacity = 0.08;
                            c.mesh.material.transparent = true;
                        }
                    }
                });

                const center = (z.start + z.end) / 2;
                controls.target.set(center, cSize.h / 3, cSize.w / 2);
                camera.position.set(center + 7, 7, cSize.w + 7);
                controls.update();
                renderer.render(scene, camera);
                const img = renderer.domElement.toDataURL('image/png');

                const doc = new jsPDF();
                doc.setFillColor(15, 23, 42);
                doc.rect(0, 0, 210, 45, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFont("helvetica", "bold");
                doc.setFontSize(22);
                doc.text("CERTIFICADO DE CUBICAJE", 15, 22);
                doc.setFontSize(10);
                doc.text("LOGISTICA JUAREZ PRO | REPORTE INDUSTRIAL", 15, 30);
                doc.setFontSize(12);
                doc.setTextColor(59, 130, 246);
                doc.text("PROVEEDOR: " + pName.toUpperCase(), 15, 38);

                doc.setTextColor(30, 41, 59);
                doc.setFontSize(11);
                doc.text("1. DATOS DE UBICACION", 15, 55);
                const data = [
                    ["Unidad", "Caja 53'"],
                    ["Tramo (m)", z.start.toFixed(2) + "m a " + z.end.toFixed(2) + "m"],
                    ["Espacio", (z.end - z.start).toFixed(2) + " metros"],
                    ["Fecha", new Date().toLocaleDateString()]
                ];
                doc.autoTable({ startY: 58, body: data, theme: 'plain', styles: { fontSize: 8 }, columnStyles: { 0: { fontStyle: 'bold', width: 40 } } });

                doc.setFontSize(11);
                doc.text("2. PERSPECTIVA DE CARGA (SU MATERIAL RESALTADO)", 15, 88);
                doc.addImage(img, 'PNG', 15, 92, 180, 80);

                const pCargo = cargo.filter(c => c.prov === pName);
                const bts = {};
                pCargo.forEach(c => {
                    bts[c.bid] = bts[c.bid] || { ...c, q: 0 };
                    bts[c.bid].q++;
                });
                const body = Object.values(bts).map((b, i) => [
                    i + 1,
                    b.q,
                    b.l + 'x' + b.w + 'x' + b.h + 'm',
                    (b.l * b.w * Math.ceil(b.q / 2)).toFixed(2) + ' m²',
                    b.q > 1 ? "ESTIBA 1+1" : "SIMPLE"
                ]);
                doc.autoTable({
                    startY: 185,
                    head: [['Lote', 'Cant.', 'Dim.', 'Huella', 'Tipo']],
                    body: body,
                    theme: 'grid',
                    headStyles: { fillColor: [59, 130, 246], fontSize: 8 },
                    styles: { fontSize: 8, halign: 'center' }
                });

                const lastY = doc.lastAutoTable.finalY + 10;
                doc.setFontSize(11);
                doc.text("3. INSTRUCCIONES DE EMBALAJE Y SEGURIDAD", 15, lastY);
                const inst = [
                    ["EMBALAJE", "- Playo de alta resistencia (minimo 4 capas).\n- Esquineros estructurales en bordes."],
                    ["SEGURIDAD", "- Distribuir peso uniformemente.\n- Asegurar niveles superiores con banda."]
                ];
                doc.autoTable({ startY: lastY + 3, body: inst, theme: 'plain', styles: { fontSize: 7 }, columnStyles: { 0: { fontStyle: 'bold', width: 25, textColor: [37, 99, 235] } } });

                doc.setDrawColor(200);
                doc.line(20, 270, 80, 270);
                doc.line(130, 270, 190, 270);
                doc.setFontSize(7);
                doc.text("RESPONSABLE ALMACEN", 32, 275);
                doc.text("RECEPTOR / CHOFER", 145, 275);

                doc.save("Certificado_" + pName.replace(/\s+/g, '_') + ".pdf");
            }

            cargo.forEach(c => {
                if (c.mesh) {
                    c.mesh.material.color.set(c.color);
                    c.mesh.material.opacity = 1;
                    c.mesh.material.transparent = false;
                }
            });
            controls.target.copy(oldTarget);
            camera.position.copy(oldPos);
            controls.update();
            refreshLoad();
        }

        function resetAll() {
            cargo.forEach(c => disposeMesh(c.mesh));
            cargo = [];
            allCargo = [];
            batchIdCounter = 0;
            zones = [];
            updateUI();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
